name: ${MP_COMPOSE_PROJECT:?Run tools/r0.py setup first}
services:
  edge:
    image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    depends_on: [app]
    volumes: [proxyconfig:/etc/nginx/conf.d:ro]
    ports: ["127.0.0.1:${MP_HTTP_PORT:-18069}:8069"]
    read_only: true
    tmpfs: [/tmp, "/var/cache/nginx:uid=101,gid=101,mode=0755", "/var/run:uid=101,gid=101,mode=0755"]
    mem_limit: 128m
    cpus: 0.5
    networks: [runtime, edge]
  db:
    image: postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - dbconfig:/run/secrets:ro
    entrypoint: [bash, /run/secrets/postgres-entrypoint.sh]
    command: [postgres, -c, max_connections=64, -c, shared_buffers=128MB]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1
    networks: [runtime]
  app:
    image: ${MP_IMAGE:-modular-platform:r0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db: {condition: service_healthy}
    command: [-c, /run/secrets/odoo_config, "--addons-path=/opt/modular/addons,/opt/modular/fixtures/${MP_FIXTURE_VARIANT:-v1}"]
    volumes: [filestore:/var/lib/modular, appconfig:/run/secrets:ro]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1536m
    cpus: 2
    networks: [runtime]
  maintenance:
    image: ${MP_IMAGE:-modular-platform:r0}
    profiles: [maintenance]
    depends_on:
      db: {condition: service_healthy}
    entrypoint: [python, /opt/modular/tools/r0_inside.py]
    volumes:
      - filestore:/var/lib/modular
      - appconfig:/run/secrets:ro
      - bootstrap:/run/mp-bootstrap:ro
      - evidence:/evidence
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1536m
    cpus: 2
    networks: [runtime]
volumes:
  pgdata:
  filestore:
  appconfig:
    external: true
    name: ${MP_COMPOSE_PROJECT}_appconfig
  dbconfig:
    external: true
    name: ${MP_COMPOSE_PROJECT}_dbconfig
  bootstrap:
    external: true
    name: ${MP_COMPOSE_PROJECT}_bootstrap
  evidence:
    external: true
    name: ${MP_COMPOSE_PROJECT}_evidence
  proxyconfig:
    external: true
    name: ${MP_COMPOSE_PROJECT}_proxyconfig
networks:
  runtime:
    internal: true
  edge:
